title = "Two-element dipole array -- interference"

# Two identical oscillators driven in phase, separated along x by d = 7.85
# (~ lambda/2 for omega = 0.4, lambda ~ 15.7). The far field is the single-
# element doughnut times an array factor cos(k d/2 sin theta_x): a broadside
# main lobe with grating side lobes. Flip one charge's phase to pi to switch
# to an end-fire pattern.
[domain]
nx = 460
ny = 460
lx = 96.0
ly = 96.0
c = 1.0
eps0 = 1.0

[time]
dt = 0.05
steps = 900
substeps_per_frame = 4

[[charge]]
q = 1.0
path = "linear_oscillator"
center = [-3.925, 0.0, 0.0]
axis = [0.0, 1.0, 0.0]
amplitude = 0.8
omega = 0.4
phase = 0.0

[[charge]]
q = 1.0
path = "linear_oscillator"
center = [3.925, 0.0, 0.0]
axis = [0.0, 1.0, 0.0]
amplitude = 0.8
omega = 0.4
phase = 0.0

[render_check]
warm_steps = 900

[render]
field = "E_mag"
r_weight = true
