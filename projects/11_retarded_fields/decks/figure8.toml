title = "Figure-8 (Lissajous) charge -- non-dipole radiation"

# A charge on a Lissajous figure-8 path: x = radius*sin(wt), y =
# amplitude*sin(2wt) -- oscillation along y at twice the x frequency, so the
# radiated field is a superposition of the fundamental and its first
# harmonic rather than a pure dipole. A wide domain (many wavelengths) is
# needed for that superposition to actually read in the field instead of
# just looking like an ordinary single-frequency spiral up close.
[domain]
nx = 500
ny = 500
lx = 90.0
ly = 90.0
c = 1.0
eps0 = 1.0

[time]
dt = 0.06
steps = 900
substeps_per_frame = 4

[[charge]]
q = 1.0
path = "figure8"
center = [0.0, 0.0, 0.0]
radius = 2.0
amplitude = 1.0
omega = 0.3

[render_check]
warm_steps = 700

[render]
field = "E_mag"
r_weight = true
