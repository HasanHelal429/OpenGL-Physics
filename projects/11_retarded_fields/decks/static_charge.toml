title = "Static point charge -- Coulomb field, B = 0"

# The simplest sanity scene: a charge sitting still. The Lienard-Wiechert
# result must collapse to the electrostatic Coulomb field E = q r_hat / 4 pi
# eps0 r^2 with B identically zero, at every retarded time.
[domain]
nx = 400
ny = 400
lx = 24.0
ly = 24.0
c = 1.0
eps0 = 1.0

[time]
dt = 0.05
steps = 200
substeps_per_frame = 4

[[charge]]
q = 1.0
path = "static"
center = [0.0, 0.0, 0.0]

[render_check]
warm_steps = 40

[render]
field = "E_mag"
r_weight = false
log_scale = true
