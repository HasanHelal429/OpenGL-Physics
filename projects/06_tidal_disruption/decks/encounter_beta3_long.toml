title = "Tidal disruption -- n=1.5 star, M_bh=1000 M_star, beta=3, long run (fallback)"

# Same encounter as decks/encounter_beta3.toml (same ic_file -- this is a
# longer look at the same physical run, not a different one), extended past
# pericenter (t=2.82) far enough to catch the start of fallback: checking
# the beta3 run's own final-frame specific orbital energies (eps = 0.5v^2 -
# G*M_bh/r relative to the BH) showed ~54% of the star's mass is actually
# bound (eps<0), with the most-tightly-bound single particle's Kepler period
# ~18.85 -- so the earliest possible return is around t~2.82+18.85=~21.7.
# frames*substeps_per_frame*dt=50 runs comfortably past that.
[star]
ic_file = "ic/star_n1.5_encounter_beta3.bin"

[gravity]
G = 1.0
softening = 0.02

[sph]
h_init = 0.157
eta = 1.2
h_iters = 3
K = 0.424217
gamma = 1.666667
visc_alpha = 1.0
visc_beta = 2.0

[blackhole]
enabled = true
type = "point"
mass = 1000.0

[time]
dt = 0.002
substeps_per_frame = 25
frames = 1000
