title = "Circular feeding -- n=1.5 star, M_bh=10 M_star, beta=0.47 (~12 orbits)"

# Longer run of decks/circular_feeding_beta0p47.toml's validated stable
# trickle (period=19.50 at r=4.5839; that scan found 4 orbits gives
# 0.9%->6.5% mass loss, gently accelerating, no runaway). A short-run
# scan around this beta (0.472 stable, 0.478/0.485 both eventually run
# away -- see project notes) found essentially zero safe margin above
# 0.47 within one run's duration, so getting more visible shedding here
# comes from running the validated beta longer instead of pushing beta
# higher.
[star]
ic_file = "ic/star_n1.5_circular_beta0p47.bin"

[gravity]
G = 1.0
softening = 0.02

[sph]
h_init = 0.157
eta = 1.2
h_iters = 3
K = 0.424217
gamma = 1.666667
visc_alpha = 1.0
visc_beta = 2.0

[blackhole]
enabled = true
type = "point"
mass = 10.0

[time]
# period=19.50 at r=4.5839 (beta=0.47); frames*substeps_per_frame*dt=234, ~12 orbits.
dt = 0.01
substeps_per_frame = 20
frames = 1170
