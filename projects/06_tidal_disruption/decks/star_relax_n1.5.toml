title = "Star relaxation -- n=1.5 polytrope, N=4000 SPH particles, no black hole yet"

# K, Gamma, and the suggested h/softening below come straight from
# tools/make_star_ic.py's printed output for this ic_file -- regenerate both
# together if n/N/mass/radius change.
[star]
ic_file = "ic/star_n1.5.bin"

[gravity]
G = 1.0
# Smaller than the adaptive smoothing length now reached in the core
# (~0.06-0.09, vs the old fixed h=0.157 this was originally tuned against)
# on purpose -- softening comparable to or larger than the local SPH
# resolution artificially weakens self-gravity at the resolved scale.
softening = 0.02

[sph]
h_init = 0.157
eta = 1.2
h_iters = 3
K = 0.424217
gamma = 1.666667
visc_alpha = 1.0
visc_beta = 2.0

[time]
dt = 0.005
substeps_per_frame = 10
frames = 200
# Settling only: freshly Monte-Carlo-sampled particles aren't in exact
# numerical equilibrium, so without damping the star rings at its radial
# breathing mode indefinitely (bounded, not unstable, but never settles).
# 1/damping ~ 2 time units, well inside this run's 10 dynamical times.
damping = 0.5
