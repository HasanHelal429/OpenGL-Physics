title = "Binary feeding -- n=1.5 star, M_bh=10 M_star, beta=0.5, e=0.6 (~4.3 orbits)"

# Modest-mass-ratio bound orbit (see tools/make_orbit_ic.py's bound_orbit_ic),
# picked after a beta scan (0.3/0.5/0.7) against a short single-periastron
# test: beta=0.3 showed no measurable stripping, beta=0.7 already tore off
# ~11.5% of the star's particles in one pass, beta=0.5 gave the target
# "mostly intact star + thin stripped stream each periastron passage" look
# (90th-percentile spread from COM barely moved, ~0.2% of particles pulled
# into an extended tail).
#   M_bh=10 M_star -> tidal radius r_t = R_star*(M_bh/M_star)^(1/3) = 2.1544
#   beta=0.5 -> pericenter r_p = r_t/beta = 4.3089
#   e=0.6 -> semi-major axis a=10.7722, apocenter r_0=17.2355, period=70.248
# Starts at apocenter with purely tangential velocity (a turning point).
[star]
ic_file = "ic/star_n1.5_binary_beta0p5_e0p6.bin"

[gravity]
G = 1.0
softening = 0.02

[sph]
h_init = 0.157
eta = 1.2
h_iters = 3
K = 0.424217
gamma = 1.666667
visc_alpha = 1.0
visc_beta = 2.0

[blackhole]
enabled = true
type = "point"
mass = 10.0

[time]
# dt=0.01 << pericenter dynamical time sqrt(r_p^3/(G*M_bh))=2.828 (already
# used, no instability, in the beta scan test). frames*substeps_per_frame*dt
# = 300, ~4.3 periods (period=70.248) -- several repeated periastron
# "feeding" passages.
dt = 0.01
substeps_per_frame = 20
frames = 1500
