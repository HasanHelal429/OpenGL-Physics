title = "Molecular Dynamics -- LJ dilute gas (rho*=0.05, T*=2.0)"

[system]
target_n = 500
density = 0.05
temperature = 2.0
seed = 3

[potential]
cutoff = 2.5
skin = 0.3

[thermostat]
type = "berendsen"
target_t = 2.0
tau = 1.0

[time]
dt = 0.002
substeps_per_frame = 25
frames = 300
neighbor_rebuild_every = 5
