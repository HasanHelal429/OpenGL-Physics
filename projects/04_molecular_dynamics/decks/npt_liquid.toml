title = "Molecular Dynamics -- Berendsen NPT liquid (target P*=0.05 near the triple point)"

# Starts LOOSER (rho*=0.70) than decks/liquid.toml's rho*=0.8442 -- the
# barostat should compress the box until the measured pressure matches
# target_p, landing near the same density the fixed-density NVT liquid run
# settles at. See README's "Validation: NPT barostat" for the actual
# density/pressure trace and the cross-check against decks/liquid.toml.
[system]
target_n = 500
density = 0.70
temperature = 0.72
seed = 6

[potential]
cutoff = 2.5
skin = 0.3

[thermostat]
type = "berendsen"
target_t = 0.72
tau = 1.0

[barostat]
enabled = true
target_p = 0.05
tau_p = 2.0
compressibility = 1.0

[time]
dt = 0.002
substeps_per_frame = 25
frames = 2500
neighbor_rebuild_every = 5
