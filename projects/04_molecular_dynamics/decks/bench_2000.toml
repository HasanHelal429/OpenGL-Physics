title = "Performance benchmark -- N~2000, NVE (thermostat off to isolate the force loop)"

# Not a physics-validation deck -- used to measure wall-clock performance
# before/after force-loop optimizations (see README's Performance section).
# Few frames, many substeps per frame: snapshot/IO overhead should be
# negligible relative to the 2000 compute steps actually being timed.
[system]
target_n = 2000
density = 0.8442
temperature = 0.72
seed = 1

[potential]
cutoff = 2.5
skin = 0.3

[thermostat]
type = "none"

[time]
dt = 0.002
substeps_per_frame = 400
frames = 5
neighbor_rebuild_every = 5
