title = "Performance benchmark -- N~8000, NVE (thermostat off to isolate the force loop)"

# See bench_2000.toml -- same protocol, 4x the particle count, to check how
# each optimization's speedup scales with N (allocation/cache fixes should
# matter more here than at N~2000).
[system]
target_n = 8000
density = 0.8442
temperature = 0.72
seed = 1

[potential]
cutoff = 2.5
skin = 0.3

[thermostat]
type = "none"

[time]
dt = 0.002
substeps_per_frame = 400
frames = 5
neighbor_rebuild_every = 5
