title = "2D TDSE - coherent state in a harmonic trap"

[grid]
n = 512
lx = 40.0
ly = 40.0

[time]
dt = 0.003
substeps_per_frame = 8
frames = 320

# Displaced ground state (a coherent state): rigidly oscillates at omega with
# period 2*pi/omega ~ 6.28, energy constant.
[initial]
type = "gaussian"
x0 = 4.0
y0 = 0.0
sigma = 1.0
kx = 0.0
ky = 0.0

[boundary]
type = "periodic"

[[potential]]
type = "harmonic"
omega = 1.0
x0 = 0.0
y0 = 0.0

[output]
diagnostics = ["norm", "energy", "kinetic", "potential_energy", "x_mean", "y_mean", "x_var", "y_var", "px_mean"]
transmission_x = 0.0
