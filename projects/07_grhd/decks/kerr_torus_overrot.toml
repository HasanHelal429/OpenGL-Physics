title = "GRHD non-equilibrium test -- over-rotating (1.1x) FM torus, a=0.9M"

# Same rho(r,theta)/P(r,theta) as decks/kerr_torus.toml's equilibrium
# Fishbone-Moncrief torus, but v_phi scaled by 1.1 (tools/make_fm_torus_ic.py's
# --vphi_scale) -- excess centrifugal support on purpose, breaking
# equilibrium the other way. Expect the torus to puff out / spread
# outward rather than accrete, unlike the under-rotating case.
geometry = "kerr_torus"

[grid]
nr = 96
ntheta = 64
r_min = 4.0
r_max = 30.0
theta_min = 0.5

[physics]
M = 1.0
a = 0.9
gamma = 1.333333

[torus]
ic_file = "ic/fm_torus_a09_overrot.bin"

[solver]
cons_to_prim_iters = 40

[time]
cfl = 0.15
substeps_per_frame = 20
frames = 150
