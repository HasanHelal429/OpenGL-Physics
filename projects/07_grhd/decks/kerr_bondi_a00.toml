title = "GRHD non-equilibrium cross-check -- Bondi accretion on Kerr-Schild, a=0.0M"

# The exact Schwarzschild relativistic Bondi solution (tools/bondi_analytic.py,
# tools/make_kerr_bondi_ic.py), sampled onto the 2D Kerr-Schild grid at a=0.
# Should reduce to a steady, already-validated solution -- an independent
# cross-check of the 2D KS pipeline (con2prim, reconstruction, HLLE+tight
# wave speeds, source terms) against the DIFFERENT 1D Schwarzschild solver
# this project already trusts (decks/bondi_schwarzschild.toml). Compare the
# measured inner-boundary accretion rate (tools/plot_accretion.py) against
# the analytic Mdot_abs printed by make_kerr_bondi_ic.py.
geometry = "kerr_torus"

[grid]
nr = 96
ntheta = 32
r_min = 3.0
r_max = 30.0
theta_min = 0.5

[physics]
M = 1.0
a = 0.0
gamma = 1.4

[torus]
ic_file = "ic/kerr_bondi_a00.bin"

[solver]
cons_to_prim_iters = 40

[time]
cfl = 0.15
substeps_per_frame = 50
frames = 150
