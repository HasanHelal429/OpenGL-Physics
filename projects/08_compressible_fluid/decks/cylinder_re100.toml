title = "Compressible Navier-Stokes -- cylinder vortex shedding, Re=100"

# Flow past a circular cylinder in a channel, mirroring the geometry/BCs of
# ../../../Physics Simulations/Fluid Mechanics/MAC_Grid_Solver's
# Cylinder_Vortex_Shedding.ipynb: Re=100 is comfortably inside the 2D
# laminar periodic-shedding window (onset ~Re_c=47; real 3D wakes
# transition ~Re=190). mach=0.2 keeps this weakly compressible (soundspeed
# = U_inf/mach = 5, so even the ~2x-U_inf peak surface speed potential-flow
# theory predicts near the cylinder stays well subsonic) without the
# acoustic stiffness a much lower Mach number would need a preconditioner
# to handle well. cells_per_d=8 is a first-pass resolution compromise
# (coarser than the Python reference's own already-flagged 12) chosen for
# a tractable single-run compute budget -- see tools/plot_strouhal.py and
# the project README for what this run actually found and whether it's
# resolution-sensitive.
[cylinder]
diameter = 1.0
reynolds = 100.0
u_inf = 1.0
blockage = 0.125
upstream_d = 5.0
downstream_d = 20.0
cells_per_d = 8.0
probe_distance_d = 4.0

[physics]
gamma = 1.4
rho0 = 1.0
mach = 0.2

[time]
# dt is fixed at ~0.0034 (CFL=0.3 against the initial uniform-inflow wave
# speed, see CompressibleSimCylinder.cpp's comment), so
# frames*substeps_per_frame*dt ~ 320*120*0.0034 =~ 131 time units --
# enough for the impulsive-start transient to decay (shedding period
# ~1/St~6.3, so this is ~20 periods) plus a genuine measurement window
# for the FFT (~15 periods) after discarding an initial transient in
# analysis (see tools/plot_strouhal.py's --transient).
cfl = 0.3
substeps_per_frame = 120
frames = 320
