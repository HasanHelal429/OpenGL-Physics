title = "Cold collapse (N=5000, uniform sphere at rest)"
# A uniform sphere with zero velocity: self-gravity wins, the cloud
# free-falls to a dense core (~t=1.1 in G=M=R=1 units) then rebounds into a
# violently relaxed halo. Total energy should be conserved through the
# bounce; Barnes-Hut monopole drifts ~1% transiently at max compression
# (see docs/SIMULATION.md).

[sim]
G = 1.0

[time]
frames = 320
substeps_per_frame = 8

[solver]
kind = "barnes_hut"
theta = 0.5

[scenario]
type = "cold_collapse"
n = 5000
seed = 1
