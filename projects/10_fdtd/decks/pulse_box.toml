title = "Gaussian pulse in a closed PEC box"

# A broadband point source in a perfectly-conducting box: the pulse radiates,
# reflects off the walls (E_z = 0), and rattles around forever. The exact
# discrete FDTD energy is conserved to round-off -- a stability / correctness
# check with no absorbing boundary in the way.
[grid]
nx = 240
ny = 240
dx = 1.0
courant = 0.6

[boundary]
type = "pec"

[time]
steps = 2400
substeps_per_frame = 8

[[source]]
kind = "gaussian"
x = 90.0
y = 120.0
f0 = 0.07
amplitude = 1.0

[probe]
points = [90.0, 120.0, 170.0, 120.0]
